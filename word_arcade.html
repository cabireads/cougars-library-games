<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Word Arcade</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#253047}*{box-sizing:border-box}body{margin:0;background:#e9edff}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #ffba4b;outline-offset:3px}.app{min-height:100dvh;overflow:hidden}.dream{--accent:#e754ac;--dark:#87366f;--sky1:#ffd6f2;--sky2:#b9ecff;--land:#a9e8a0;--hill:#73cba0;--building:#fff1fc}.monster{--accent:#81ed60;--dark:#433177;--sky1:#2e2259;--sky2:#7650a0;--land:#647b69;--hill:#3e5552;--building:#3b345b;color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#ffffffd9;color:#27314c;flex-wrap:wrap}.monster .top{background:#211d42e8;color:#fff}.logo{font-size:clamp(21px,4vw,32px);font-weight:1000}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill,.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:900;background:#fff;color:#29314a;box-shadow:0 4px 0 #0002}.btn.primary{background:var(--accent,#df5ca8);color:#fff}.btn:active,.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:#fffffff0;color:#29314a;border-radius:26px;padding:22px;box-shadow:0 12px 35px #0002}.monster .panel{background:#f6f0ff}.center{text-align:center}.muted{opacity:.72}.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;max-width:650px;margin:20px auto}.profile{border:4px solid transparent;border-radius:26px;background:white;padding:22px 8px;min-height:180px;box-shadow:0 9px 0 #0001}.profile .big{font-size:72px;display:block}.profile strong{font-size:22px}.profile:hover{border-color:#e36ec2}.world{position:relative;min-height:680px;background:linear-gradient(var(--sky1),var(--sky2) 57%,var(--land) 57%);isolation:isolate;overflow:hidden;border-radius:0 0 25px 25px}.world:before{content:'';position:absolute;left:-15%;bottom:-28%;width:130%;height:60%;background:var(--hill);border-radius:50% 50% 0 0;z-index:-1}.skyart{position:absolute;top:20px;left:5%;font-size:clamp(30px,6vw,65px);letter-spacing:16px;opacity:.85;pointer-events:none}.map{max-width:950px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:100px 20px 40px}.building{min-height:145px;background:var(--building);color:var(--dark);border:4px solid #ffffff99;border-radius:28px 28px 18px 18px;box-shadow:0 12px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 4px;transition:transform .15s}.building:hover{transform:translateY(-5px)}.building .emoji{font-size:clamp(40px,6vw,65px)}.building span:last-child{font-size:clamp(12px,2vw,17px);font-weight:1000;text-align:center}.character{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:66px;animation:bob 2s infinite;pointer-events:none;filter:drop-shadow(0 7px 2px #0003)}@keyframes bob{50%{transform:translate(-50%,-9px)}}.game{max-width:700px;margin:18px auto}.game h1{margin:6px 0}.wordbtn{font-size:24px;min-height:75px;min-width:130px;border:3px solid #c8c2ef;background:#fff;border-radius:22px;padding:16px;font-weight:900;color:#252b49}.wordbtn:active{background:#d8f4ff}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.speaker{font-size:26px;background:#fff0b4;border:0;border-radius:25px;padding:20px;min-width:170px;font-weight:900;color:#503a3a}.answer{font-size:28px;max-width:100%;width:350px;padding:14px;border:3px solid #b7b0df;border-radius:15px;text-align:center}.feedback{font-size:21px;font-weight:900;min-height:40px;margin:14px}.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.tiles{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px auto}.tile{min-width:45px;height:50px;border:0;border-radius:12px;background:#ffe2a4;box-shadow:0 4px #c99e59;font-size:24px;font-weight:900}.tile:disabled{opacity:.3}.status{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:12px}.tag{background:#e9e7fa;border-radius:20px;padding:8px 12px;color:#393255;font-weight:800}.setting{margin:12px 0}.setting select{padding:10px;border-radius:12px;border:2px solid #aaa6ce;max-width:100%;background:white}.small{font-size:13px}.hide{display:none!important}@media(max-width:600px){.map{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding-top:85px;padding-bottom:100px}.building{min-height:115px}.world{min-height:950px}.profiles{grid-template-columns:1fr}.panel{padding:15px}.top{padding:9px}.wordbtn{min-width:100px}.choices{gap:8px}.character{bottom:25px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}</style></head><body><div id="app" class="app dream"><div class="wrap"><div class="panel center"><h1>🎮 Word Arcade</h1><p>Preparing your worlds…</p><p id="errorHelp">If this stays here, please send me a screenshot.</p></div></div></div><script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a)a.innerHTML='<main class="wrap"><div class="panel"><h1>⚠️ Word Arcade had an error</h1><p>'+String(e.message).replace(/[<>&]/g,'')+'</p><p>Send me a screenshot of this message.</p></div></main>';});
'use strict';
// Transcribed from the two uploaded word lists. IMSE entries are Spell & Read words only.
const daughter=[['the','I','and','a','is','as','said','to','do','of'],['see','he','be','me','from','look','book','are','was','you'],['what','have','your','want','go','no','so','goes','says','she'],['we','they','their','were','talk','walk','could','would','should','or'],['for','there','where','who','by','my','one','once','two','does'],['any','many','been','into','friend','because']];
const imse={1:'the',2:'was',3:'is',4:'a',5:'on',6:'and',7:'to',8:'for',9:'go',10:'I like',11:'of,will',12:'get,no',13:'want,with',14:'said,you',15:'in,put',16:'see,stop',17:'from,off',18:'he,has',19:'have,me',20:'his,as',21:'my,into',22:'now,new',23:'give',24:'or,by',25:'went',26:'do,are',27:'they,any',28:'',29:'',30:'one,two',31:'come',32:'who,what,where,why',33:'were,does',34:'some,good',35:'there,done',36:'her,here',37:'under,down',38:'onto,people',39:'saw,both',40:'should,could,would,over',41:'love,live,out',42:'day,too,eye',43:'all,again',44:'boy,girl,sign',45:'your,which,look',46:'also,use',47:'today,yesterday',48:'first,around,going',49:'walk',50:'say,their',51:'how,once',52:'another',53:'pull,wash',54:'every,everyone',55:'know,knew',56:'friend',57:'been,our,other',58:'away,after',59:'few,many',60:'call,room,ball',61:'water,watch',62:'far,goes',63:'because,very',64:'door,car',65:'great,though',66:'don’t,little',67:'through',68:'always,hour',69:'sure,buy',70:'',71:'only',72:'these,those,took',73:'work,word,world',74:'touch',75:'',76:'hall',77:'enough,laugh,read',78:'often',79:'heard,thought',80:'together',81:'different',82:'move',83:''};
// The photographed IMSE concept 10 has the phrase "I, like"; store as separate words.
imse[10]='I,like';
const names={claw:'Word Grabber',monster:'Feed the Monster',balloon:'Balloon Pop',race:'Word Racers',spell:'Listen & Spell',scramble:'Letter Scramble',treasure:'Treasure Hunt'};
const icons={claw:'🕹️',monster:'🍽️',balloon:'🎈',race:'🏎️',spell:'🔊',scramble:'🔤',treasure:'💎'};
const themes={girl:'dream',boy:'monster'};
const key='wordArcadeV1';let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};
function profile(id){if(!store[id])store[id]={tickets:0,rounds:0,avatar:id==='girl'?'🌈🐱':'🦖',level:id==='girl'?1:18,records:{},decor:[],history:[]};return store[id]}
function save(){try{localStorage.setItem(key,JSON.stringify(store))}catch(e){console.warn('Local saving unavailable',e)}}
let who=null,view='home',game='spell',q=null,round=0,correct=0,attempts=0,choice=[],tileText='',tileUsed=[],mode='keyboard',feedback='',locked=false,missed=[],adventure=false;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function words(){let p=profile(who);if(who==='girl')return daughter[p.level-1].slice();let arr=[];for(let i=1;i<=p.level;i++)arr.push(...(imse[i]||'').split(',').map(s=>s.trim()).filter(Boolean));return [...new Set(arr)]}
function rec(w){let p=profile(who);return p.records[w]||(p.records[w]={reading:0,spelling:0,misses:0})}
function renderHeader(){let p=profile(who);return `<header class="top"><div class="logo">${who==='girl'?'🌈 Rainbow Dreamland':'👻 Monster Mayhem'}</div><div class="pills"><span class="pill">${p.avatar} ${who==='girl'?'Kitten':'Kaiju'}</span><span class="pill">🎟️ ${p.tickets}</span><button class="pill" onclick="showSettings()">⚙️ Parent</button><button class="pill" onclick="home()">🏠 Map</button><button class="pill" onclick="switchKid()">⇄ Profiles</button></div></header>`}
function render(){app.className='app '+(who?themes[who]:'dream');if(!who){app.innerHTML=`<div class="wrap"><div class="panel center"><h1>🎮 WORD ARCADE</h1><p>Choose your adventurer!</p><div class="profiles"><button class="profile" onclick="choose('girl')"><span class="big">🌈🐱</span><strong>Rainbow Dreamland</strong><p>Pink clouds & kittens</p></button><button class="profile" onclick="choose('boy')"><span class="big">🦖</span><strong>Monster Mayhem</strong><p>Roars & spooky fun</p></button></div><p class="muted small">Progress is saved in this browser. Cloud sync is not connected yet.</p></div></div>`;return}if(view==='map'){app.innerHTML=renderHeader()+`<main class="world"><div class="skyart">${who==='girl'?'🌈 ☁️ 💗 ✨':'🌙 👻 🦇 ⚡'}</div><div class="map">${Object.keys(names).map(g=>`<button class="building" onclick="start('${g}')"><span class="emoji">${icons[g]}</span><span>${names[g]}</span></button>`).join('')}<button class="building" onclick="startAdventure()"><span class="emoji">🗺️</span><span>Arcade Adventure</span></button><button class="building" onclick="shop()"><span class="emoji">🛍️</span><span>Decoration Shop</span></button><button class="building" onclick="showStats()"><span class="emoji">🏆</span><span>My Progress</span></button><button class="building" onclick="closet()"><span class="emoji">🎭</span><span>Character Closet</span></button></div><div class="character">${profile(who).avatar}</div></main>`;return}if(view==='game'){drawGame();return}}
function choose(id){who=id;profile(id);view='map';save();render()}function switchKid(){who=null;view='home';speechSynthesis.cancel();render()}function home(){view='map';adventure=false;speechSynthesis.cancel();render()}
function speak(word){if(!('speechSynthesis'in window)){alert('Speech is not supported in this browser. Try Safari or Chrome.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;u.pitch=1;let voices=speechSynthesis.getVoices();let preferred=voices.find(v=>v.lang.startsWith('en')&&/Samantha|Ava|Google US English|Jenny/i.test(v.name))||voices.find(v=>v.lang.startsWith('en-US'));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}
function start(g){game=g;view='game';round=0;correct=0;missed=[];adventure=false;next()}function startAdventure(){adventure=true;game='monster';view='game';round=0;correct=0;missed=[];next()}
function pick(){let pool=words();if(!pool.length)return 'the';let weighted=pool.flatMap(w=>{let r=rec(w);return Array(Math.max(1,4-Math.min(3,r.misses===0?r.spelling:r.spelling-r.misses))).fill(w)});let filtered=weighted.filter(w=>w!==q);return (filtered.length?filtered:weighted)[Math.floor(Math.random()*(filtered.length?filtered.length:weighted.length))]}
function next(){locked=false;feedback='';attempts=0;tileText='';tileUsed=[];q=missed.length&&round>=4?missed.shift():pick();window.currentLetters=null;round++;let pool=[...new Set(words().filter(w=>w!==q))];pool.sort(()=>Math.random()-.5);choice=[q,...pool.slice(0,3)].sort(()=>Math.random()-.5);drawGame();if(game!=='scramble')setTimeout(()=>{if(view==='game'&&!locked)speak(q)},350)}
function drawGame(){let isSpell=['spell','scramble','treasure'].includes(game);let title=names[game];let p=profile(who);let body='';if(game==='spell'||game==='treasure'){body=`<div class="center"><button class="speaker" onclick="speak(q)">🔊 Hear the word</button><p class="muted">Listen carefully. The word is hidden!</p><input id="answer" class="answer" aria-label="Spell the word" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" onkeydown="if(event.key==='Enter')checkTyped()" placeholder="Type the word"><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkTyped()">Check spelling ✓</button><button class="btn" onclick="hint()">💡 Hint</button></div></div>`}else if(game==='scramble'){let letters=window.currentLetters;if(!letters){letters=[...q].map((c,i)=>({c,i})).sort(()=>Math.random()-.5);window.currentLetters=letters;}body=`<div class="center"><button class="speaker" onclick="speak(q)">🔊 Hear the word</button><p>Tap letters in order to spell it.</p><div class="answer" style="margin:auto;min-height:66px">${esc(tileText)||'_'}</div><div class="tiles">${letters.map((t,i)=>`<button class="tile" ${tileUsed.includes(i)?'disabled':''} onclick="tapTile(${i})">${esc(t.c)}</button>`).join('')}</div><div class="row"><button class="btn" onclick="tileText='';tileUsed=[];drawGame()">↺ Clear</button><button class="btn primary" onclick="checkTiles()">Check ✓</button></div></div>`}else{body=`<div class="center"><button class="speaker" onclick="speak(q)">🔊 Hear the word</button><p>${game==='claw'?'Grab the word the claw wants!':game==='monster'?'Feed the hungry creature the right word!':game==='balloon'?'Pop the balloon with the right word!':'Choose the word to race ahead!'}</p><div style="font-size:65px;margin:10px">${game==='monster'?(who==='girl'?'🐰':'👹'):game==='claw'?'🕹️':game==='balloon'?'🎈🎈🎈':'🏁🏎️'}</div><div class="choices">${choice.map(w=>`<button class="wordbtn" onclick="checkChoice('${encodeURIComponent(w)}')">${game==='balloon'?'🎈 ':''}${esc(w)}</button>`).join('')}</div></div>`}
app.innerHTML=renderHeader()+`<main class="wrap game"><div class="panel center"><div class="row"><button class="btn" onclick="home()">← World</button><span class="tag">${adventure?'Adventure • ':''}${esc(title)}</span><span class="tag">Round ${round} • ⭐ ${correct}</span></div><h1>${icons[game]} ${esc(title)}</h1>${body}<div class="feedback" id="feedback" aria-live="polite">${esc(feedback)}</div><div id="after" class="row"></div><p class="muted small">${isSpell?'Spelling practice':'Reading recognition practice'} • Words from ${who==='girl'?'List '+p.level:'Concepts 1–'+p.level}</p></div></main>`}
function hint(){let el=document.getElementById('feedback');el.textContent='Hint: '+q[0].toUpperCase()+'… ('+q.length+' letters)';attempts++}
function checkTyped(){if(locked)return;let val=document.getElementById('answer').value.trim().toLowerCase().replace(/’/g,"'");grade(val===q.toLowerCase().replace(/’/g,"'"),true)}
function tapTile(i){if(locked||tileUsed.includes(i))return;tileUsed.push(i);tileText+=window.currentLetters[i].c;drawGame()}
function checkTiles(){if(locked)return;grade(tileText.toLowerCase()===q.toLowerCase(),true)}
function checkChoice(w){if(locked)return;grade(decodeURIComponent(w)===q,false)}
function grade(ok,spelling){let r=rec(q);let msg=document.getElementById('feedback'),after=document.getElementById('after');if(ok){locked=true;correct++;r[spelling?'spelling':'reading']++;let tickets=attempts===0?3:1;profile(who).tickets+=tickets;msg.textContent=['🎉 Brilliant!','✨ You got it!','🌟 Super spelling!','🎟️ Nice work!'][Math.floor(Math.random()*4)]+' +'+tickets+' tickets';after.innerHTML=`<button class="btn primary" onclick="advance()">Next word →</button>`;save()}else{attempts++;r.misses++;if(!missed.includes(q))missed.push(q);msg.textContent='Not quite! Listen and try again. 💪';save();if(attempts>=3){locked=true;msg.textContent='The word is “'+q+'”. You can practice it again soon.';after.innerHTML=`<button class="btn primary" onclick="advance()">Next word →</button>`}else if(game==='scramble'){tileText='';tileUsed=[];setTimeout(()=>{if(view==='game'&&!locked)drawGame()},600)}else if(!spelling){setTimeout(()=>{if(view==='game'&&!locked)speak(q)},300)}}}
function advance(){if(round>=8){profile(who).rounds++;save();if(adventure){let seq=['monster','claw','spell','balloon','scramble','race','treasure'];let idx=seq.indexOf(game);if(idx<seq.length-1){game=seq[idx+1];round=0;correct=0;missed=[];next();return}}view='done';app.innerHTML=renderHeader()+`<main class="wrap"><div class="panel center"><h1>🏆 Round complete!</h1><p style="font-size:65px">${profile(who).avatar}</p><h2>You earned stars and tickets!</h2><p>Your world is waiting for you.</p><button class="btn primary" onclick="home()">Back to my world 🗺️</button><button class="btn" onclick="start('${game}')">Play again ↻</button></div></main>`}else next()}
function showSettings(){let p=profile(who);view='settings';let options=who==='girl'?daughter.map((_,i)=>`<option value="${i+1}" ${p.level===i+1?'selected':''}>List ${i+1}</option>`).join(''):Array.from({length:83},(_,i)=>`<option value="${i+1}" ${p.level===i+1?'selected':''}>Through Concept ${i+1}</option>`).join('');app.innerHTML=renderHeader()+`<main class="wrap"><div class="panel"><h1>⚙️ Parent Settings</h1><p>This first version has no parent PIN yet. Kids can open these settings.</p><div class="setting"><label><strong>Practice words:</strong><br><select onchange="setLevel(this.value)">${options}</select></label></div><p class="muted">${who==='girl'?'Only the selected list is used.':'All Spell & Read words from Concept 1 through your selected concept are included.'}</p><div class="row"><button class="btn primary" onclick="home()">Done</button><button class="btn" onclick="exportProgress()">⬇️ Back up progress</button></div><p class="small muted">Cloud sync is not enabled. This version saves to this browser only. Export a backup before clearing browser data.</p></div></main>`}
function setLevel(v){profile(who).level=Number(v);save();showSettings()}
function exportProgress(){let blob=new Blob([JSON.stringify({version:1,profiles:store},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='word-arcade-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function showStats(){let p=profile(who),r=Object.entries(p.records);view='stats';app.innerHTML=renderHeader()+`<main class="wrap"><div class="panel"><h1>🏆 My Progress</h1><div class="status"><span class="tag">🎟️ ${p.tickets} tickets</span><span class="tag">🎮 ${p.rounds} rounds</span><span class="tag">📚 ${r.filter(([w,v])=>v.reading>=3).length} reading practice wins</span><span class="tag">✍️ ${r.filter(([w,v])=>v.spelling>=3).length} spelling practice wins</span></div><h3>Words to practice</h3><p>${r.filter(([w,v])=>v.misses>0).sort((a,b)=>b[1].misses-a[1].misses).slice(0,30).map(([w,v])=>`<span class="tag" style="display:inline-block;margin:3px">${esc(w)} (${v.misses})</span>`).join('')||'No missed words yet!'}</p><p class="small muted">Practice wins count repeated correct answers, not a formal mastery assessment.</p><button class="btn primary" onclick="home()">Back to world</button></div></main>`}
function closet(){let p=profile(who);view='closet';let avatars=who==='girl'?['🌈🐱','🐈','🐱','🦄']:['🦖','🐉','👾','🦎'];app.innerHTML=renderHeader()+`<main class="wrap"><div class="panel center"><h1>🎭 Character Closet</h1><p>Choose your adventurer!</p><div class="row">${avatars.map(a=>`<button class="wordbtn" style="font-size:42px" onclick="setAvatar('${a}')">${a}</button>`).join('')}</div><p class="muted">More original animated characters and costumes are planned.</p><button class="btn primary" onclick="home()">Back to world</button></div></main>`}
function setAvatar(a){profile(who).avatar=a;save();closet()}
function shop(){let p=profile(who);view='shop';let items=who==='girl'?[['🌷','Flower Garden'],['🌈','Rainbow Arch'],['🦋','Butterfly Friends'],['🎀','Pink Bows']]:[['🌋','Slime Volcano'],['👻','Ghost Friends'],['🦇','Bat Cave'],['⚡','Lightning Tower']];app.innerHTML=renderHeader()+`<main class="wrap"><div class="panel center"><h1>🛍️ Decoration Shop</h1><p>🎟️ You have ${p.tickets} tickets. Each decoration costs 15.</p><div class="choices">${items.map(([e,n])=>`<button class="wordbtn" onclick="buy('${e}')">${e}<br>${n}<br>${p.decor.includes(e)?'✓ Owned':'15 tickets'}</button>`).join('')}</div><p>Your decorations are saved in your collection. Placing them around the map comes in the next version.</p><p>Collection: ${p.decor.join(' ')||'Nothing yet'}</p><button class="btn primary" onclick="home()">Back to world</button></div></main>`}
function buy(e){let p=profile(who);if(p.decor.includes(e))return;if(p.tickets<15){alert('Keep practicing to earn more tickets!');return}p.tickets-=15;p.decor.push(e);save();shop()}
try { render(); } catch(e) { document.getElementById('app').innerHTML='<main class="wrap"><div class="panel"><h1>⚠️ Startup error</h1><p>'+String(e.message).replace(/[<>&]/g,'')+'</p></div></main>'; }
</script></body></html>
