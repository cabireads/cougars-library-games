<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sketch World 2.0</title><style>body{margin:0;font:16px system-ui;background:#102338;color:white}button,select{font:inherit;padding:10px;border:0;border-radius:9px;margin:4px;cursor:pointer}header{padding:12px;background:#102338;display:flex;flex-wrap:wrap;align-items:center;gap:8px}canvas{display:block;width:100vw;height:calc(100vh - 75px);background:#126e9c}#scan{display:none;padding:15px}#scan img{max-width:240px;max-height:240px}#scan canvas{width:260px;height:260px;display:none}#status{font-size:13px;opacity:.8}input{max-width:90%}</style></head><body><header><b>🌎 Sketch World</b><button id="display">Display</button><button id="scanner">Scan artwork</button><select id="world"><option value="ocean">🐠 Aquarium</option><option value="city">🚗 City</option><option value="sky">🦋 Sky</option><option value="space">🚀 Space</option></select><button id="snapshot">📸 Snapshot</button><button id="record">⏺ Record 15s</button><button id="clear">Clear world</button><span id="status">V2 cutouts · no live syncing yet</span></header><main><canvas id="scene"></canvas><section id="scan"><h2>Scan a colored drawing</h2><p>For tonight: choose a photo of a drawing. This version removes the outside paper while keeping white and light colors inside closed outlines. Use a coloring page with a bold, continuous outline.</p><input type="file" accept="image/*" capture="environment" id="photo"><p><label>White background removal <input id="threshold" type="range" min="175" max="250" value="225"></label></p><p><label>Trim outer border <input id="trim" type="range" min="0" max="12" value="0"> <span id="trimValue">0%</span></label></p><canvas id="preview" width="350" height="350"></canvas><p><button id="release">Release into world!</button></p><p id="scanStatus"></p></section></main><script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),pv=document.querySelector('#preview'),pc=pv.getContext('2d');let world='ocean',objects=[],photo=null,last=0,recording=false,cutout=null;const rnd=(a,b)=>a+Math.random()*(b-a);function size(){canvas.width=innerWidth*devicePixelRatio;canvas.height=(innerHeight-document.querySelector('header').offsetHeight)*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();function bg(w,h,t){let g=ctx.createLinearGradient(0,0,0,h);if(world==='ocean'){g.addColorStop(0,'#075c9e');g.addColorStop(1,'#17b6b6')}else if(world==='city'){g.addColorStop(0,'#86d5ff');g.addColorStop(1,'#e9f6fc')}else if(world==='sky'){g.addColorStop(0,'#68bffb');g.addColorStop(1,'#d4f4ff')}else{g.addColorStop(0,'#090b31');g.addColorStop(1,'#4c2475')}ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(world==='ocean'){ctx.fillStyle='#d7b877';ctx.beginPath();ctx.moveTo(0,h*.92);for(let x=0;x<=w;x+=20)ctx.lineTo(x,h*.92+Math.sin(x/60)*10);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();for(let i=0;i<26;i++){let x=i*w/25;ctx.strokeStyle=['#147d73','#239f86','#df8a80'][i%3];ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,h);ctx.quadraticCurveTo(x+20,h-50,x+Math.sin(i)*20,h-rndFixed(i)*85);ctx.stroke()}for(let i=0;i<55;i++){let x=(i*97)%w,y=(i*73-t*(.01+i%4*.01))%h;if(y<0)y+=h;ctx.strokeStyle='#bdeff5aa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,2+i%5,0,7);ctx.stroke()}}else if(world==='city'){for(let i=0;i<Math.ceil(w/62);i++){let x=i*62,height=110+(i*37)%125;ctx.fillStyle=['#809cb4','#dca88b','#98b7a9'][i%3];ctx.fillRect(x,h*.72-height,57,height);ctx.fillStyle='#ffe9ac';for(let j=0;j<3;j++)for(let k=0;k<3;k++)ctx.fillRect(x+10+j*15,h*.72-height+15+k*25,8,12)}ctx.fillStyle='#48535d';ctx.fillRect(0,h*.72,w,h*.28);ctx.strokeStyle='#f6e5a7';ctx.lineWidth=4;ctx.setLineDash([30,24]);ctx.beginPath();ctx.moveTo(0,h*.86);ctx.lineTo(w,h*.86);ctx.stroke();ctx.setLineDash([])}else if(world==='sky'){ctx.fillStyle='#ffffffaa';for(let i=0;i<12;i++){let x=(i*191+t*.012)% (w+140)-70,y=40+(i*89)%(h*.55);for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x+j*20,y+(j%2)*-9,20,0,7);ctx.fill()}}ctx.fillStyle='#76c88d';ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w;x+=10)ctx.lineTo(x,h*.9+Math.sin(x/85)*20);ctx.lineTo(w,h);ctx.fill()}else{for(let i=0;i<120;i++){ctx.fillStyle='#ffffff'+['88','cc','ff'][i%3];ctx.fillRect((i*137)%w,(i*83)%h,1+i%3,1+i%3)}for(let i=0;i<4;i++){ctx.fillStyle=['#e6a46d','#7da8da','#c3a3e6','#75cfb4'][i];ctx.beginPath();ctx.arc((i*.28+.12)*w,(i%2*.45+.22)*h,16+i*9,0,7);ctx.fill()}}}function rndFixed(n){return ((n*17)%13)/13+.5}function frame(t){let w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;bg(w,h,t);for(const o of objects){o.x+=o.v*(Math.min(50,t-last)/16);if(o.x>w+o.sz)o.x=-o.sz;if(o.x< -o.sz)o.x=w+o.sz;let y=o.y+Math.sin(t*.0014+o.phase)*8;ctx.save();ctx.translate(o.x,y);if(o.v<0)ctx.scale(-1,1);ctx.drawImage(o.img,-(o.dw||o.sz)/2,-(o.dh||o.sz)/2,o.dw||o.sz,o.dh||o.sz);ctx.restore()}last=t;requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#world').onchange=e=>{world=e.target.value;objects=[]};document.querySelector('#scanner').onclick=()=>{document.querySelector('#scan').style.display='block';canvas.style.display='none'};document.querySelector('#display').onclick=()=>{document.querySelector('#scan').style.display='none';canvas.style.display='block';size()};document.querySelector('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;photo=new Image();photo.onload=process;photo.src=URL.createObjectURL(f)};document.querySelector('#threshold').oninput=()=>{if(photo)process()};document.querySelector('#trim').oninput=()=>{document.querySelector('#trimValue').textContent=document.querySelector('#trim').value+'%';if(photo)process()};function process(){
 const N=600,work=document.createElement('canvas');work.width=work.height=N;const c=work.getContext('2d',{willReadFrequently:true});
 c.clearRect(0,0,N,N);const margin=12,scale=Math.min((N-2*margin)/photo.width,(N-2*margin)/photo.height);
 const ox=Math.round((N-photo.width*scale)/2),oy=Math.round((N-photo.height*scale)/2),iw=Math.round(photo.width*scale),ih=Math.round(photo.height*scale);
 c.fillStyle='#fff';c.fillRect(0,0,N,N);c.drawImage(photo,ox,oy,iw,ih);
 const image=c.getImageData(0,0,N,N),d=image.data,threshold=+document.querySelector('#threshold').value;
 const trim=+document.querySelector('#trim').value/100, x0=Math.round(ox+iw*trim),x1=Math.round(ox+iw*(1-trim)),y0=Math.round(oy+ih*trim),y1=Math.round(oy+ih*(1-trim));
 const visited=new Uint8Array(N*N),queue=new Int32Array(N*N);let head=0,tail=0;
 function light(p){const i=p*4,r=d[i],g=d[i+1],b=d[i+2];return Math.min(r,g,b)>threshold && Math.max(r,g,b)-Math.min(r,g,b)<45}
 function enqueue(x,y){if(x<x0||x>=x1||y<y0||y>=y1)return;let p=y*N+x;if(!visited[p]&&light(p)){visited[p]=1;queue[tail++]=p}}
 for(let x=x0;x<x1;x++){enqueue(x,y0);enqueue(x,y1-1)}for(let y=y0;y<y1;y++){enqueue(x0,y);enqueue(x1-1,y)}
 while(head<tail){let p=queue[head++],x=p%N,y=(p/N)|0;enqueue(x-1,y);enqueue(x+1,y);enqueue(x,y-1);enqueue(x,y+1)}
 let minX=N,minY=N,maxX=-1,maxY=-1;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let p=y*N+x,i=p*4;
 if(x<x0||x>=x1||y<y0||y>=y1||visited[p]){d[i+3]=0;continue}
 // Keep every pixel enclosed by the outer outline, including white and pastel coloring.
 if(d[i+3]>0){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}
 }
 c.putImageData(image,0,0);pc.clearRect(0,0,350,350);
 if(maxX<minX){cutout=null;document.querySelector('#scanStatus').textContent='No drawing detected. Try a lower threshold or less border trim.';return}
 const pad=3,cw=maxX-minX+1,ch=maxY-minY+1;cutout=document.createElement('canvas');cutout.width=cw+pad*2;cutout.height=ch+pad*2;
 cutout.getContext('2d').drawImage(work,minX,minY,cw,ch,pad,pad,cw,ch);
 const previewScale=Math.min(340/cutout.width,340/cutout.height);
 pc.drawImage(cutout,(350-cutout.width*previewScale)/2,(350-cutout.height*previewScale)/2,cutout.width*previewScale,cutout.height*previewScale);
 pv.style.display='block';document.querySelector('#scanStatus').textContent='Preview ready. White areas enclosed by black outlines are preserved. If an outside rectangular border remains, increase Trim outer border slightly.';
}
document.querySelector('#release').onclick=()=>{if(!cutout)return;let img=new Image();img.src=cutout.toDataURL('image/png');let w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
 const aspect=cutout.width/cutout.height,base=rnd(95,155),dw=aspect>=1?base:base*aspect,dh=aspect>=1?base/aspect:base;
 objects.push({img,x:rnd(30,Math.max(31,w-30)),y:world==='city'?rnd(h*.75,h*.92):rnd(80,Math.max(81,h*.75)),v:rnd(.35,1.3)*(Math.random()<.5?-1:1),phase:rnd(0,6),sz:base,dw,dh});
 document.querySelector('#scanStatus').textContent='Released! Tap Display to see it.';
};
document.querySelector('#snapshot').onclick=()=>{let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='sketch-world.png';a.click()};document.querySelector('#clear').onclick=()=>{if(confirm('Clear all artwork in this world?'))objects=[]};document.querySelector('#record').onclick=()=>{if(recording)return;if(!canvas.captureStream||typeof MediaRecorder==='undefined'){alert('Recording is not supported in this browser. Try Chrome on a computer.');return}let stream=canvas.captureStream(24),mime=['video/webm;codecs=vp9','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){alert('No supported recording format.');return}let chunks=[],rec=new MediaRecorder(stream,{mimeType:mime});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob(chunks,{type:mime}));a.href=url;a.download='sketch-world.'+(mime.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);recording=false;document.querySelector('#record').textContent='⏺ Record 15s'};recording=true;document.querySelector('#record').textContent='Recording…';rec.start();setTimeout(()=>rec.stop(),15000)};
</script></body></html>
