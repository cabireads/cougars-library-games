<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabi City • Sketch World</title><style>*{box-sizing:border-box}body{margin:0;background:#14243b;color:#fff;font:15px system-ui,sans-serif}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 13px;background:#15283f}button{background:#d9f1ff;border:0;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}button.primary{background:#a6e3ad}button:disabled{opacity:.45}header strong{font-size:19px;margin-right:10px}header small{color:#b9d5e5}#scene{display:block;width:100%;height:calc(100dvh - 65px);min-height:300px}#scan{display:none;max-width:750px;margin:20px auto;padding:15px}#scan canvas{width:280px;height:280px;background:repeating-conic-gradient(#e4e9ee 0 25%,#fff 0 50%) 50%/24px 24px;object-fit:contain;border-radius:12px}label{display:block;margin:12px 0}input{max-width:100%}#note{font-size:13px;color:#d0e5ef}#status{font-size:13px;color:#b9d5e5}#count{font-weight:700}#scan button{margin-right:8px}body.scan #scan{display:block}body.scan #scene{display:none}body.scan #status{display:none}@media(max-width:700px){header strong{width:100%}#scene{height:calc(100dvh - 120px)}} </style></head><body><header><strong>🚗 Cabi City</strong><button id="view">🌆 City display</button><button id="scanBtn">📷 Scan a car</button><button id="demo">+ Demo car</button><button id="snapshot">📸 Snapshot</button><button id="record">⏺ Record 15s</button><button id="reset">🧹 Reset traffic</button><span id="status"><span id="count">0</span> cars • Newest cars drive in front; older cars cycle through all three back roads</span></header><canvas id="scene"></canvas><section id="scan"><h2>Release a car into Cabi City</h2><p>Choose a photo or coloring page. The cutout keeps white interiors enclosed by dark outlines.</p><input type="file" id="photo" accept="image/*" capture="environment"><label>White paper threshold <input type="range" id="threshold" min="170" max="250" value="225"></label><label>Trim border <input type="range" id="trim" min="0" max="15" value="0"> <span id="trimValue">0%</span></label><canvas id="preview" width="350" height="350"></canvas><p><button class="primary" id="release" disabled>🚗 Release into traffic!</button><button id="back">Back to city</button></p><p id="note">Use a coloring page with a bold, closed outline and a plain white background.</p></section><script>
const scene=document.querySelector('#scene'),ctx=scene.getContext('2d'),preview=document.querySelector('#preview'),pc=preview.getContext('2d');let cars=[],cutout=null,photo=null,last=0,recording=false;const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);function resize(){let r=scene.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);scene.width=Math.max(1,Math.round(r.width*d));scene.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function dims(){let d=Math.min(devicePixelRatio||1,2);return [scene.width/d,scene.height/d]}
function roadY(layer,x,w,h){if(layer===0)return h*.87+Math.sin(x/w*Math.PI*3.2)*h*.048+Math.sin(x/w*Math.PI*5)*h*.016;if(layer===1)return h*.665+Math.sin(x/w*Math.PI*2.6+1)*h*.025;if(layer===2)return h*.37;if(layer===3)return h*.50;return h*.8}
function drawRoad(layer,w,h){let elevated=layer>=2,y=roadY(layer,0,w,h),thick=layer===0?62:layer===1?42:28;ctx.save();if(elevated){ctx.fillStyle='#788593';for(let x=55;x<w;x+=180){ctx.fillRect(x,y+thick,13,h*.72-y-thick)}ctx.fillStyle='#667483';ctx.fillRect(0,y+thick-2,w,7)}ctx.beginPath();for(let x=-10;x<=w+10;x+=8){let ry=roadY(layer,x,w,h);if(x===-10)ctx.moveTo(x,ry);else ctx.lineTo(x,ry)}for(let x=w+10;x>=-10;x-=8)ctx.lineTo(x,roadY(layer,x,w,h)+thick);ctx.closePath();ctx.fillStyle=elevated?'#737f8e':layer===0?'#596a7d':'#728396';ctx.fill();ctx.strokeStyle=elevated?'#c6d0d9':'#d7e1e6';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=w;x+=8){let yy=roadY(layer,x,w,h)+2;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke();if(!elevated){ctx.strokeStyle='#ffe7a3';ctx.lineWidth=2.5;ctx.setLineDash([20,17]);ctx.beginPath();for(let x=0;x<=w;x+=8){let yy=roadY(layer,x,w,h)+thick*.52;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke();ctx.setLineDash([])}ctx.restore()}
function background(w,h,t){let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#7cc9f3');g.addColorStop(.7,'#d7eff9');g.addColorStop(1,'#b6d6b3');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff2b0';ctx.beginPath();ctx.arc(w*.83,h*.14,Math.min(w,h)*.065,0,7);ctx.fill();ctx.fillStyle='#ffffffb8';for(let i=0;i<8;i++){let x=((i*167+t*.004)%(w+150))-75,y=h*(.08+(i%3)*.055);for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(x+j*18,y-(j%2)*8,24,12,0,0,7);ctx.fill()}}for(let i=0;i<Math.ceil(w/55)+1;i++){let x=i*55,hh=h*(.15+(i*13%9)*.013),top=h*.35-hh;ctx.fillStyle=['#8299b5','#e0aa95','#97b8ac','#b4a6c7'][i%4];ctx.fillRect(x,top,50,hh+h*.24);ctx.fillStyle='#f9e9b3';for(let xx=x+8;xx<x+45;xx+=15)for(let yy=top+12;yy<top+hh-8;yy+=20)ctx.fillRect(xx,yy,7,9)}ctx.fillStyle='#7db58d';ctx.fillRect(0,h*.68,w,h*.32);drawRoad(2,w,h);drawRoad(3,w,h);ctx.fillStyle='#78b786';ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w;x+=10)ctx.lineTo(x,h*.81+Math.sin(x/w*8)*h*.05);ctx.lineTo(w,h);ctx.fill();drawRoad(1,w,h);drawRoad(0,w,h)}
function direction(layer){return layer===0||layer===3?-1:1}
function desiredLayer(age){if(age<6)return 0;if(age<12)return 1;return 1+(Math.floor((age-12)/4)%3)}
function updateLayers(){for(let i=0;i<cars.length;i++){let car=cars[i],age=cars.length-1-i;car.older=age>=12;let target=desiredLayer(age);if(car.layer!==target)car.pendingLayer=target}}
function addCar(img){let [w,h]=dims(),a=img.width/img.height;cars.push({img,layer:0,pendingLayer:null,older:false,x:w+110+Math.random()*w*.2,speed:rnd(.65,1.85),phase:rnd(0,6),aspect:a});updateLayers();$('#count').textContent=cars.length}
function demoCar(){let c=document.createElement('canvas');c.width=210;c.height=100;let p=c.getContext('2d');let colors=['#f1797c','#ffcf59','#77c5e9','#c5a0f4','#85d5a3'];p.fillStyle=colors[cars.length%colors.length];p.strokeStyle='#1f2d42';p.lineWidth=5;p.beginPath();p.moveTo(18,40);p.lineTo(52,40);p.lineTo(77,13);p.lineTo(145,13);p.lineTo(167,40);p.lineTo(191,40);p.quadraticCurveTo(202,40,202,54);p.lineTo(202,73);p.lineTo(8,73);p.lineTo(8,52);p.quadraticCurveTo(8,40,18,40);p.fill();p.stroke();p.fillStyle='#d7f5ff';p.fillRect(80,20,60,19);p.fillStyle='#25344b';for(let x of [51,164]){p.beginPath();p.arc(x,76,16,0,7);p.fill();p.fillStyle='#d4dce8';p.beginPath();p.arc(x,76,7,0,7);p.fill();p.fillStyle='#25344b'}let img=new Image();img.onload=()=>addCar(img);img.src=c.toDataURL()}
function frame(t){let [w,h]=dims(),dt=Math.min(40,t-last||16)/16;last=t;background(w,h,t);
for(let layer of [2,3,1,0])for(let car of cars){if(car.layer!==layer)continue;
let current=car.layer,dir=direction(current),sz=current===0?Math.min(140,w*.14):current===1?Math.min(80,w*.09):Math.min(38,w*.045),cw=sz,ch=sz/car.aspect;
car.x+=dir*car.speed*dt*(current>=2?.8:1);
let exited=dir>0?car.x>w+cw:car.x< -cw;
if(exited){if(car.pendingLayer!==null){car.layer=car.pendingLayer;car.pendingLayer=null}
else if(car.older){car.layer=car.layer===1?2:car.layer===2?3:1}
current=car.layer;dir=direction(current);sz=current===0?Math.min(140,w*.14):current===1?Math.min(80,w*.09):Math.min(38,w*.045);cw=sz;ch=sz/car.aspect;car.x=dir>0?-cw:w+cw;}
let thick=current===0?62:current===1?42:28;
let surface=roadY(current,car.x,w,h)+(current>=2?4:thick*.52);
let y=surface-ch*.46;
let tilt=current<=1?Math.atan2(roadY(current,car.x+5,w,h)-roadY(current,car.x-5,w,h),10):0;
ctx.save();ctx.translate(car.x,y+Math.sin(t*.003+car.phase)*(current===0?1.1:.3));ctx.rotate(tilt);if(dir<0)ctx.scale(-1,1);ctx.drawImage(car.img,-cw/2,-ch/2,cw,ch);ctx.restore();}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('#scanBtn').onclick=()=>document.body.classList.add('scan');$('#view').onclick=$('#back').onclick=()=>{document.body.classList.remove('scan');resize()};$('#demo').onclick=demoCar;$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;photo=new Image();photo.onload=process;photo.src=URL.createObjectURL(f)};$('#threshold').oninput=()=>photo&&process();$('#trim').oninput=()=>{$('#trimValue').textContent=$('#trim').value+'%';if(photo)process()};function process(){const N=500,work=document.createElement('canvas');work.width=work.height=N;let c=work.getContext('2d',{willReadFrequently:true});c.fillStyle='#fff';c.fillRect(0,0,N,N);let scale=Math.min((N-24)/photo.width,(N-24)/photo.height),iw=Math.round(photo.width*scale),ih=Math.round(photo.height*scale),ox=Math.round((N-iw)/2),oy=Math.round((N-ih)/2);c.drawImage(photo,ox,oy,iw,ih);let im=c.getImageData(0,0,N,N),d=im.data,threshold=+$('#threshold').value,trim=+$('#trim').value/100,x0=Math.round(ox+iw*trim),x1=Math.round(ox+iw*(1-trim)),y0=Math.round(oy+ih*trim),y1=Math.round(oy+ih*(1-trim));let seen=new Uint8Array(N*N),queue=new Int32Array(N*N),head=0,tail=0;function white(p){let i=p*4,r=d[i],g=d[i+1],b=d[i+2];return Math.min(r,g,b)>threshold&&Math.max(r,g,b)-Math.min(r,g,b)<45}function put(x,y){if(x<x0||x>=x1||y<y0||y>=y1)return;let p=y*N+x;if(!seen[p]&&white(p)){seen[p]=1;queue[tail++]=p}}for(let x=x0;x<x1;x++){put(x,y0);put(x,y1-1)}for(let y=y0;y<y1;y++){put(x0,y);put(x1-1,y)}while(head<tail){let p=queue[head++],x=p%N,y=(p/N)|0;put(x-1,y);put(x+1,y);put(x,y-1);put(x,y+1)}let minX=N,minY=N,maxX=-1,maxY=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let p=y*N+x,i=p*4;if(x<x0||x>=x1||y<y0||y>=y1||seen[p]){d[i+3]=0;continue}minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}c.putImageData(im,0,0);pc.clearRect(0,0,350,350);if(maxX<minX){cutout=null;$('#release').disabled=true;$('#note').textContent='No drawing found. Try a different threshold.';return}let pad=3,cw=maxX-minX+1,ch=maxY-minY+1;cutout=document.createElement('canvas');cutout.width=cw+pad*2;cutout.height=ch+pad*2;cutout.getContext('2d').drawImage(work,minX,minY,cw,ch,pad,pad,cw,ch);let ps=Math.min(340/cutout.width,340/cutout.height);pc.drawImage(cutout,(350-cutout.width*ps)/2,(350-cutout.height*ps)/2,cutout.width*ps,cutout.height*ps);$('#release').disabled=false;$('#note').textContent='Preview ready. Check that the car is solid and the outer border is gone.'}$('#release').onclick=()=>{if(!cutout)return;let img=new Image();img.onload=()=>{addCar(img);document.body.classList.remove('scan');resize()};img.src=cutout.toDataURL('image/png')};$('#snapshot').onclick=()=>{let a=document.createElement('a');a.download='cabi-city.png';a.href=scene.toDataURL('image/png');a.click()};$('#reset').onclick=()=>{if(confirm('Clear every car in Cabi City?')){cars=[];$('#count').textContent=0}};$('#record').onclick=()=>{if(recording)return;if(!scene.captureStream||!window.MediaRecorder){alert('Recording is unavailable in this browser. Try Chrome on your Mac.');return}let mime=['video/webm;codecs=vp9','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime){alert('Recording format not supported');return}let rec=new MediaRecorder(scene.captureStream(24),{mimeType:mime}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:mime})),a=document.createElement('a');a.href=u;a.download='cabi-city.'+(mime.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);recording=false;$('#record').textContent='⏺ Record 15s'};recording=true;$('#record').textContent='Recording…';rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),15000)};
</script></body></html>
