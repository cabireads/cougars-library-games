<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camp Taylor Library — Daily Slides</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#000}main{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.board{height:43px;flex:0 0 43px;background:#061b2d;border-bottom:2px solid #ffcf27;color:#fff1d1;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,30px);padding:2px 10px;white-space:nowrap;overflow:hidden}.date{font-size:clamp(14px,1.8vw,25px);font-weight:850;letter-spacing:.02em}.time{display:flex;align-items:center;gap:3px;height:35px;color:#ffcf27;font-weight:900;font-variant-numeric:tabular-nums}.tile{position:relative;display:flex;align-items:center;justify-content:center;height:33px;min-width:26px;padding:0 5px;border:1px solid #020b12;border-radius:4px;background:linear-gradient(#25333d 0%,#14222d 49%,#0a1823 51%,#172631 100%);font-size:clamp(21px,2.25vw,31px);line-height:1;backface-visibility:hidden}.tile:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid #000a;pointer-events:none}.colon{font-size:25px;padding:0 2px}.flip{animation:flip .5s ease}@keyframes flip{0%{transform:rotateX(-65deg);filter:brightness(1.5)}100%{transform:rotateX(0)}}.slide-space{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#000;--slide-scale:.82}.slides{display:block;position:absolute;top:0;left:0;width:calc(100% / var(--slide-scale));height:calc(100% / var(--slide-scale));transform:scale(var(--slide-scale));transform-origin:top left;border:0;background:#000}.fallback{position:fixed;right:8px;bottom:8px;background:#061827;color:#fff;border:1px solid #ffcf27;border-radius:6px;padding:6px 9px;font-size:11px;text-decoration:none;opacity:.7}@media(max-width:600px){.board{height:40px;flex-basis:40px;gap:10px;padding:2px 5px}.date{font-size:clamp(10px,2.4vw,16px)}.tile{height:29px;min-width:23px;padding:0 3px;font-size:21px}.time{height:32px;gap:2px}.colon{font-size:22px;padding:0}}
</style></head><body><main><header class="board" aria-label="Live date and time"><span class="date" id="date">THURSDAY, NOVEMBER 5</span><div class="time" aria-label="Current Louisville time"><span class="tile" id="hour">6</span><span class="colon">:</span><span class="tile" id="m1">3</span><span class="tile" id="m2">3</span></div></header><div class="slide-space"><iframe class="slides" title="Camp Taylor Daily Slides" src="https://www.canva.com/design/DAHUn-WD1zw/eDXAAqOWHteIzt0AU2IcWQ/view?embed" allow="fullscreen" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></main><a class="fallback" target="_blank" rel="noopener" href="https://www.canva.com/design/DAHUn-WD1zw/eDXAAqOWHteIzt0AU2IcWQ/view">Open slides directly</a><script>
const tz='America/New_York';function update(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value||'';const minute=get('minute');const vals={date:`${get('weekday')}, ${get('month')} ${get('day')}`.toUpperCase(),hour:get('hour'),m1:minute[0],m2:minute[1]};for(const [id,value]of Object.entries(vals)){const el=document.getElementById(id);if(el.textContent!==value){el.textContent=value;if(id!=='date'){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}}}}update();setInterval(update,1000);
</script></body></html>
