<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camp Taylor Library — Daily Slides</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#050e19}main{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.board{height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.5vw,24px);padding:6px clamp(8px,2vw,30px);background:#061b2d;color:#fff1d1;border-bottom:3px solid #ffcf27;overflow:hidden}.symbol{font-size:clamp(18px,2.4vw,32px);line-height:1;flex:none}.date{font-size:clamp(13px,2.05vw,30px);font-weight:900;letter-spacing:.025em;white-space:nowrap;flex-shrink:1;min-width:0}.time{display:flex;align-items:center;justify-content:center;gap:clamp(2px,.35vw,6px);height:58px;flex:none}.tile{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(#25333d 0%,#14222d 49%,#0a1823 51%,#172631 100%);border:1px solid #020b12;border-radius:5px;box-shadow:inset 0 1px 2px #81919b55;color:#ffcf27;font-size:clamp(29px,4vw,51px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;width:clamp(30px,4.4vw,60px);height:55px;backface-visibility:hidden}.tile:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid #000a;pointer-events:none}.colon{font-size:clamp(26px,3.5vw,46px);font-weight:900;color:#ffcf27}.ampm{font-size:clamp(16px,2vw,26px);width:clamp(36px,5vw,66px)}.flip{animation:flip .55s ease}@keyframes flip{0%{transform:rotateX(-65deg);filter:brightness(1.5)}100%{transform:rotateX(0)}}.slides{display:block;flex:1 1 auto;min-height:0;width:100%;border:0;background:#000}.fallback{position:fixed;right:8px;bottom:8px;background:#061827;color:#fff;border:1px solid #ffcf27;border-radius:6px;padding:6px 9px;font-size:11px;text-decoration:none;opacity:.7}@media(max-width:850px){.board{height:64px;flex-basis:64px;gap:6px;padding:4px 7px}.date{font-size:clamp(11px,2vw,17px)}.time{height:48px}.tile{height:45px;width:clamp(24px,5vw,38px);font-size:clamp(23px,4vw,35px)}.ampm{width:36px;font-size:16px}.colon{font-size:28px}.symbol{font-size:18px}}@media(max-width:540px){.symbol{display:none}.date{font-size:11px;letter-spacing:0}.board{gap:5px}.tile{width:24px;font-size:23px}.ampm{width:30px;font-size:13px}}
</style></head><body><main><header class="board" aria-label="Live date and flip clock"><span class="symbol" aria-hidden="true">🚆</span><span class="date" id="date">THURSDAY, NOVEMBER 5</span><div class="time" aria-label="Current Louisville time"><span class="tile" id="h1"></span><span class="tile" id="h2">6</span><span class="colon">:</span><span class="tile" id="m1">2</span><span class="tile" id="m2">3</span><span class="tile ampm" id="ampm">PM</span></div><span class="symbol" aria-hidden="true">✈</span></header><iframe class="slides" title="Camp Taylor Daily Slides" src="https://www.canva.com/design/DAHUn-WD1zw/eDXAAqOWHteIzt0AU2IcWQ/view?embed" allow="fullscreen" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe></main><a class="fallback" target="_blank" rel="noopener" href="https://www.canva.com/design/DAHUn-WD1zw/eDXAAqOWHteIzt0AU2IcWQ/view">Open slides directly</a><script>
const tz='America/New_York';function update(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value||'';const h=get('hour').padStart(2,' '),m=get('minute');const vals={date:`${get('weekday')}, ${get('month')} ${get('day')}`.toUpperCase(),h1:h[0]===' '?'':h[0],h2:h[1],m1:m[0],m2:m[1],ampm:get('dayPeriod')};for(const [id,v]of Object.entries(vals)){const el=document.getElementById(id);if(el.textContent!==v){el.textContent=v;if(id!=='date'){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}}}}update();setInterval(update,1000);
</script></body></html>
