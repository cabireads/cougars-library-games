<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camp Taylor Library — Daily Slides</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#061827}main{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.board{flex:none;height:148px;width:100%;border:4px solid #fff1d1;border-radius:13px;background:linear-gradient(115deg,#061b2d,#001322 55%,#061b2d);color:#fff1d1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:29px 75px 24px;align-items:center;justify-items:center;gap:2px 10px;padding:5px 15px;overflow:hidden}
.date{grid-column:2;grid-row:1;font-size:clamp(13px,1.65vw,23px);font-weight:900;letter-spacing:.075em;white-space:nowrap}.train{grid-column:1;grid-row:1;justify-self:start}.plane{grid-column:3;grid-row:1;justify-self:end}.symbol{font-size:25px;color:#fff1d1;line-height:1}
.time{grid-column:1/4;grid-row:2;display:flex;align-items:stretch;justify-content:center;gap:5px;height:100%;width:100%}.tile{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(#25333d 0%,#14222d 49%,#0a1823 51%,#172631 100%);border:2px solid #020b12;border-radius:7px;box-shadow:inset 0 1px 2px #81919b55;color:#ffcf27;font-size:clamp(40px,5vw,66px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;min-width:0;width:clamp(54px,7vw,100px)}.tile:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px solid #0009;pointer-events:none}.colon{font-size:clamp(37px,4.8vw,63px);color:#ffcf27;align-self:center;font-weight:900}.ampm{font-size:clamp(22px,3vw,38px);width:clamp(58px,7vw,100px)}.flip{animation:flip .5s ease}@keyframes flip{from{transform:rotateX(-18deg);filter:brightness(1.4)}to{transform:rotateX(0)}}
.footer{grid-column:1/4;grid-row:3;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;white-space:nowrap}.station{font-size:clamp(12px,1.55vw,21px);font-weight:900;letter-spacing:.12em}.motto{font-size:clamp(9px,1.05vw,14px);color:#ffcf27;font-weight:800;letter-spacing:.04em}.sep{height:1px;width:clamp(14px,4vw,65px);background:#fff1d1}
.slides{flex:1;min-height:0;width:100%;border:0;background:#000}.fallback{position:fixed;bottom:8px;right:8px;background:#061827;color:#fff;border:1px solid #ffcf27;border-radius:6px;padding:6px 9px;font-size:11px;text-decoration:none;opacity:.75}
@media(max-width:650px){.board{height:124px;grid-template-rows:24px 62px 20px;padding:4px 6px;gap:2px}.symbol{font-size:19px}.time{gap:3px}.tile{width:clamp(35px,10vw,65px);font-size:clamp(30px,8vw,48px)}.ampm{font-size:21px}.colon{font-size:36px}.footer{gap:7px}.motto{font-size:8px}.sep{width:12px}}
</style></head><body><main>
<header class="board" aria-label="Live Library Station clock"><span class="symbol train" aria-hidden="true">🚆</span><span class="date" id="date">THURSDAY, NOVEMBER 5</span><span class="symbol plane" aria-hidden="true">✈</span>
<div class="time" aria-label="Current time"><span class="tile" id="h1">6</span><span class="tile" id="h2"> </span><span class="colon">:</span><span class="tile" id="m1">2</span><span class="tile" id="m2">3</span><span class="tile ampm" id="ampm">PM</span></div>
<div class="footer"><span class="sep"></span><span class="station">LIBRARY STATION</span><span class="sep"></span><span class="motto">ALL GOOD READERS DEPART HERE</span></div></header>
<iframe class="slides" title="Camp Taylor Daily Slides" src="https://www.canva.com/design/DAHUn-WD1zw/eDXAAqOWHteIzt0AU2IcWQ/view?embed" allow="fullscreen" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe></main>
<a class="fallback" target="_blank" rel="noopener" href="https://www.canva.com/design/DAHUn-WD1zw/eDXAAqOWHteIzt0AU2IcWQ/view">Open slides directly</a>
<script>
const tz='America/New_York';function update(){const now=new Date();const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(now);const get=t=>parts.find(p=>p.type===t)?.value||'';const hour=get('hour').padStart(2,' '),minute=get('minute');const vals={date:`${get('weekday')}, ${get('month')} ${get('day')}`.toUpperCase(),h1:hour[0]===' '?'':hour[0],h2:hour[1],m1:minute[0],m2:minute[1],ampm:get('dayPeriod')};for(const [id,v] of Object.entries(vals)){const el=document.getElementById(id);if(el.textContent!==v){el.textContent=v;if(id!=='date'){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}}}}update();setInterval(update,1000);
</script></body></html>
