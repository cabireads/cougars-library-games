<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Station Clock</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif}body{padding:0}.board{width:100%;aspect-ratio:2.04/1;background:linear-gradient(125deg,#061827,#001224 60%,#061b2b);border:clamp(3px,.8vw,12px) solid #fff3d8;border-radius:clamp(12px,2.6vw,38px);padding:1.4% 2%;color:#fff4dc;display:flex;flex-direction:column;box-shadow:inset 0 0 0 5px #09253a;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:2%;height:19%;border-bottom:clamp(2px,.35vw,5px) solid #fff3d8}.symbol{width:11%;height:75%;display:grid;place-items:center}.symbol svg{height:100%;width:100%;fill:#fff3dc}.date{font-size:clamp(12px,4.4vw,75px);font-weight:900;letter-spacing:.055em;white-space:nowrap;text-align:center;flex:1;line-height:1}.clock{display:flex;align-items:stretch;justify-content:center;gap:1.3%;height:53%;padding:1.4% 2% 1%;border-bottom:clamp(2px,.35vw,5px) solid #fff3d8}.tile{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:linear-gradient(#1e2934 0%,#111d28 49.3%,#081721 50.7%,#111e29 100%);border:clamp(2px,.4vw,7px) solid #020b12;border-radius:clamp(8px,2vw,30px);box-shadow:inset 0 3px 2px #59636b55,0 2px 2px #000;color:#ffcf27;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #e5a900;flex:1}.tile:after{content:"";position:absolute;left:0;right:0;top:50%;height:clamp(1px,.2vw,3px);background:#020b12;box-shadow:0 1px 1px #69747b55}.num{font-size:clamp(40px,17vw,280px);line-height:1}.colon{font-size:clamp(35px,14vw,220px);color:#ffcf27;align-self:center;line-height:1;font-weight:900}.ampm{flex:.78;font-size:clamp(24px,8.5vw,140px)}.bottom{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:0}.station{display:flex;align-items:center;justify-content:center;gap:3%;width:100%;font-size:clamp(16px,5.5vw,95px);font-weight:900;letter-spacing:.055em;white-space:nowrap;line-height:1}.station:before,.station:after{content:"";height:clamp(2px,.25vw,4px);background:#fff3d8;flex:1}.motto{background:#ffcf27;color:#061827;font-size:clamp(10px,2.6vw,45px);font-weight:900;font-style:italic;letter-spacing:.12em;text-align:center;width:84%;padding:.2% 2%;clip-path:polygon(0 0,100% 0,98% 50%,100% 100%,0 100%,2% 50%);white-space:nowrap}.flip{animation:flip .5s ease}@keyframes flip{from{transform:rotateX(-15deg);filter:brightness(1.4)}to{transform:rotateX(0);filter:brightness(1)}}@media(max-width:700px){.board{box-shadow:inset 0 0 0 2px #09253a}.date{font-size:4.2vw}.num{font-size:16vw}.ampm{font-size:8vw}.station{font-size:5vw}.motto{font-size:2.3vw}}
</style></head><body><main class="board"><header class="top"><div class="symbol" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="25" y="12" width="50" height="62" rx="12"/><rect x="34" y="24" width="32" height="22" rx="3" fill="#061827"/><circle cx="38" cy="63" r="5" fill="#061827"/><circle cx="62" cy="63" r="5" fill="#061827"/><path d="M35 72 18 96h10l17-24m10 0 17 24h10L65 72"/><rect x="44" y="4" width="12" height="6" rx="2"/></svg></div><div id="date" class="date">THURSDAY, NOVEMBER 5</div><div class="symbol" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M94 9c-4-4-12-2-18 3L52 38 14 26 5 34l34 20-18 19-12-2-7 7 17 8 8 12 8-7-2-12 20-18 20 34 8-9-12-38 26-24c5-6 7-14 3-18z"/></svg></div></header><section class="clock" aria-label="Current time"><div class="tile num" id="h1">0</div><div class="tile num" id="h2">8</div><div class="colon">:</div><div class="tile num" id="m1">2</div><div class="tile num" id="m2">7</div><div class="tile ampm" id="ampm">AM</div></section><footer class="bottom"><div class="station">LIBRARY STATION</div><div class="motto">ALL GOOD READERS DEPART HERE</div></footer></main><script>
const zone='America/New_York';function update(){const now=new Date();const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',minute:'2-digit',hour12:true,weekday:'long',month:'long',day:'numeric'}).formatToParts(now).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));const h=parts.hour.padStart(2,'0'),m=parts.minute;const values={date:`${parts.weekday.toUpperCase()}, ${parts.month.toUpperCase()} ${parts.day}`,h1:h[0],h2:h[1],m1:m[0],m2:m[1],ampm:parts.dayPeriod};for(const [id,value] of Object.entries(values)){const el=document.getElementById(id);if(el.textContent!==value){el.textContent=value;if(id!=='date'){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}}}}update();setInterval(update,1000);
</script></body></html>
