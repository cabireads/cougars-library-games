r(--hill);border-radius:50% 50% 0 0;z-index:-1}.skyart{position:absolute;top:20px;left:5%;font-size:clamp(30px,6vw,65px);letter-spacing:16px;opacity:.85;pointer-events:none}.map{max-width:950px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:100px 20px 40px}.building{min-height:145px;background:var(--building);color:var(--dark);border:4px solid #ffffff99;border-radius:28px 28px 18px 18px;box-shadow:0 12px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 4px;transition:transform .15s}.building:hover{transform:translateY(-5px)}.building .emoji{font-size:clamp(40px,6vw,65px)}.building span:last-child{font-size:clamp(12px,2vw,17px);font-weight:1000;text-align:center}.character{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:66px;animation:bob 2s infinite;pointer-events:none;filter:drop-shadow(0 7px 2px #0003)}@keyframes bob{50%{transform:translate(-50%,-9px)}}.game{max-width:700px;margin:18px auto}.game h1{margin:6px 0}.wordbtn{font-size:24px;min-height:75px;min-width:130px;border:3px solid #c8c2ef;background:#fff;border-radius:22px;padding:16px;font-weight:900;color:#252b49}.wordbtn:active{background:#d8f4ff}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.speaker{font-size:26px;background:#fff0b4;border:0;border-radius:25px;padding:20px;min-width:170px;font-weight:900;color:#503a3a}.answer{font-size:28px;max-width:100%;width:350px;padding:14px;border:3px solid #b7b0df;border-radius:15px;text-align:center}.feedback{font-size:21px;font-weight:900;min-height:40px;margin:14px}.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.tiles{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px auto}.tile{min-width:45px;height:50px;border:0;border-radius:12px;background:#ffe2a4;box-shadow:0 4px #c99e59;font-size:24px;font-weight:900}.tile:disabled{opacity:.3}.status{display:fl /* Exploratory town preview: original layout, existing spelling engine retained */
.town-viewport{overflow:auto;max-width:100%;background:var(--sky1);border-radius:0 0 24px 24px}
.town{position:relative;width:100%;min-width:760px;aspect-ratio:1200/740;min-height:480px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#fbd8f5 0%,#d3f4ff 29%,#bceea8 30%,#8cdb9c 100%)}
.monster .town{background:linear-gradient(180deg,#201c48 0%,#4d4172 28%,#606b78 29%,#343b49 100%)}
.town:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 12% 25%,#ffffff88 0 7%,transparent 8%),radial-gradient(ellipse at 82% 17%,#ffffff88 0 6%,transparent 7%),radial-gradient(ellipse at 60% 72%,#fff9 0 2%,transparent 3%);pointer-events:none}
.town-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.town-path path{fill:none;stroke:#fff1c4;stroke-width:54;stroke-linecap:round;stroke-linejoin:round}
.town-path path+path{stroke:#e8b7a0;stroke-width:3;stroke-dasharray:9 15}
.monster .town-path path{stroke:#62606c}.monster .town-path path+path{stroke:#a38ca4}
.town-heading{position:absolute;top:3%;left:3%;font-weight:1000;color:#71397d;font-size:clamp(16px,2.4vw,32px);text-shadow:0 2px white;pointer-events:none}.monster .town-heading{color:#e2e3ff;text-shadow:0 2px #15142a}
.town-site{position:absolute;width:15%;height:21%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;z-index:3;filter:drop-shadow(0 7px 3px #0003);transition:filter .15s,transform .15s}
.town-site:hover,.town-site:focus-visible{transform:translateY(-5px);filter:drop-shadow(0 12px 5px #0005)}
.town-site .structure{width:85%;height:76%;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid #ffffffaa;border-radius:14px 14px 9px 9px;background:linear-gradient(120deg,#ffe2f5,#bca5ff);box-shadow:inset -12px -8px #7f5c9b44,0 7px #836080;}
.town-site .structure:before{content:'';position:absolute;left:-10%;right:-10%;top:-23%;height:40%;background:linear-gradient(135deg,#ef72b8,#ad62d6);clip-path:polygon(50% 0,100% 85%,100% 100%,0 100%,0 85%);border-radius:8px}
.town-site .structure .symbol{font-size:clamp(22px,3.3vw,48px);z-index:1;filter:drop-shadow(0 3px #0002)}
.town-site .site-name{display:block;background:#fffdf8;color:#613a69;font-weight:1000;font-size:clamp(10px,1.13vw,15px);padding:4px 8px;border:2px solid #c99acb;border-radius:15px;white-space:nowrap;z-index:4;margin-top:-3px;box-shadow:0 3px #0002}
.town-site:nth-of-type(3n) .structure{background:linear-gradient(120deg,#fff2c5,#ffbc8b);box-shadow:inset -12px -8px #b7776144,0 7px #a46d65}
.town-site:nth-of-type(3n) .structure:before{background:linear-gradient(135deg,#ffb44b,#f27f8c)}
.town-site:nth-of-type(4n) .structure{background:linear-gradient(120deg,#d7f8fc,#89c5f2)}
.town-site:nth-of-type(4n) .structure:before{background:linear-gradient(135deg,#73d5f5,#7c8ddd)}
.monster .town-site .structure{background:linear-gradient(120deg,#6b7082,#292d47);box-shadow:inset -12px -8px #15152499,0 7px #171727;border-color:#99a3bb}
.monster .town-site .structure:before{background:linear-gradient(135deg,#50405d,#28263f)}
.monster .town-site .site-name{background:#282638;color:#e6e9ff;border-color:#8b80aa}
.town-decor{position:absolute;pointer-events:none;font-size:clamp(18px,3vw,45px);filter:drop-shadow(0 3px 3px #0002)}
.town-avatar{position:absolute;width:10%;height:19%;left:46%;top:72%;z-index:8;transform:translate(-50%,-50%);transition:left .9s ease-in-out,top .9s ease-in-out;pointer-events:none;display:flex;align-items:center;justify-content:center}
.town-avatar img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 3px #0005)}
.town-avatar .fallback{font-size:64px}
.town-hint{position:absolute;bottom:1%;left:2%;font-size:12px;background:#ffffffdd;color:#34405b;border-radius:14px;padding:8px 12px;z-index:9}
.town-marker{position:absolute;width:18px;height:18px;border:3px solid white;background:#ffd65e;border-radius:50%;z-index:6;transform:translate(-50%,-50%);pointer-events:none;animation:pulse .7s ease-in-out infinite alternate}

@media(max-width:760px){.town-viewport{overflow-x:auto}.town{width:900px}.town-site .site-name{font-size:12px}.town-hint{font-size:11px}}

/* Monster Mayhem round one: full-map monster world and destruction */
.monster .town.unified-town{background:#171629 url('assets/coastal-ocean-map.webp') center / 100% 100% no-repeat}
.monster .town-heading{z-index:9;color:#c9ff78}

@keyframes mayhemRebuild{0%{transform:translateY(25%) rotate(-13deg) scale(.75);opacity:.3}80%{transform:translateY(-5%) scale(1.04)}100%{transform:none;opacity:1}}
@keyframes mayhemStomp{0%,100%{transform:translate(-50%,-50%)}30%{transform:translate(-50%,-85%) scale(1.12)}53%{transform:translate(-50%,-25%) scale(1.22)}65%{transform:translate(-50%,-50%)}}

function wellMixedLetters(word){
 const original=[...word].map((c,i)=>({c,i}));
 if(original.length<2)return original;

}

function raceCarAt(position,lane){
 const v=Math.max(0,Math.min(8,position));
 const theta=Math.PI/2-(2*Math.PI*v/8);
 const rx=lane==='bunny'?35.3:40.2,ry=lane==='bunny'?24.0:29.0;
 return {x:50+rx*Math.cos(theta),y:53.5+ry*Math.sin(theta),angle:theta*180/Math.PI-90};
}
function setRaceSprite(id,pos,lane){
 const car=document.getElementById(id);if(!car)return;
 const p=raceCarAt(pos,lane);car.style.left=p.x+'%';car.style.top=p.y+'%';
 // The racers stay readable as they round the corners, while their positions trace the oval.
 // The art is a three-quarter SIDE view: never rotate it onto its roof.
 // Face right on the bottom straight, left on the top straight.
 // Flip at the vertical midpoint of each end curve.
 const phase=((pos%8)+8)%8;
 const facingRight=phase<2||phase>=6;
 car.style.transform=`translate(-50%,-50%) scaleX(${facingRight?1:-1})`;
}

function scrambleBank(word){
 const chars=[...word].map((c,i)=>({c,i}));
 const extras=who==='girl'?2:3;
 const alphabet='abcdefghijklmnopqrstuvwxyz';
 const unused=[...alphabet].filter(c=>!word.toLowerCase().includes(c));
 shuffleScramble(unused);
 for(let i=0;i<extras;i++)chars.push({c:unused[i],i:-1});

}

const trophyRewards={hundred:{girl:'award-cat',boy:'award-dragon'},legend:{girl:'award-crystal',boy:'award-monster'}};
function ensureTrophies(p){
 if(!p.achievementStats){
  const r=Object.values(p.records||{});
  const knownCorrect=r.reduce((n,v)=>n+(v.reading||0)+(v.spelling||0),0);
  const spent=(p.decorItems||[]).reduce((n,o)=>{const item=(prizeCatalog[who]||[]).find(x=>x[0]===o.id);return n+(item?item[2]:0)},0);
  p.achievementStats={correct:knownCorrect,earned:Math.max(0,p.tickets||0)+spent};
 }
 if(!p.achievements)p.achievements={};
 if(!p.achievementRewards)p.achievementRewards={};
 return p.achievementStats;
}
function trophyProgress(p,t){
 const st=ensureTrophies(p);
 if(t[4]==='correct')return st.correct||0;
 if(t[4]==='earned')return st.earned||0;
 if(t[4]==='rounds')return p.rounds||0;
 if(t[4]==='unique')return Object.values(p.records||{}).filter(v=>(v.reading||0)+(v.spelling||0)>0).length;
 return 0;
}
function checkTrophies(){
 const p=profile(who);ensureTrophies(p);let changed=false;
 for(const t of trophyList){
  if(trophyProgress(p,t)>=t[3]&&!p.achievements[t[0]]){
   p.achievements[t[0]]=Date.now();changed=true;
  }
  const prize=trophyRewards[t[0]]&&trophyRewards[t[0]][who];
  if(prize&&p.achievements[t[0]]&&!p.achievementRewards[t[0]]){
   decorInventory(p);
   p.decorItems.push({uid:'award'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),id:prize,x:45,y:80,rotation:0,scale:1,stored:true,award:true});
   p.achievementRewards[t[0]]=true;changed=true;
  }
 }
 if(changed)save();
}

  ${reward?`<p class="trophy-reward">${done?'🎁 Exclusive decoration unlocked! Check your stored items.':'🎁 Unlocks an exclusive world decoration!'}</p>`:''}</article>`;
 }).join('')}</div>

function closetFitFor(id,slot){

 if(view!=='closet')return;

 el.setPointerCapture(e.pointerId);el.classList.add('fit-active');

function decorPointerMove(ev){if(!decorDrag||!decorating)return;const d=decorDrag,b=d.town.getBoundingClientRect(),p=profile(who),o=decorInventory(p).find(x=>x.uid===d.uid);if(!o)return;o.x=Math.max(5,Math.min(95,(ev.clientX-b.left)/b.width*100));o.y=Math.max(12,Math.min(94,(ev.clientY-b.top)/b.height*100));d.el.style.left=o.x+'%';d.el.style.top=o.y+'%';d.moved=true}
function decorPointerUp(){if(!decorDrag)return;const moved=decorDrag.moved;decorDrag=null;save();if(moved)render()}
function placeNextDecor(){const p=profile(who),o=decorInventory(p).find(x=>x.stored);if(!o)return;o.stored=false;o.x=45;o.y=80;selectedDecor=o.uid;save();render()}
function rotateSelectedDecor(){const o=decorInventory(profile(who)).find(x=>x.uid===selectedDecor);if(!o)return;o.rotation=((o.rotation||0)+45)%360;save();render()}
function resizeSelectedDecor(){const o=decorInventory(profile(who)).find(x=>x.uid===selectedDecor);if(!o)return;o.scale=(o.scale||1)>=1.5?.75:Math.round(((o.scale||1)+.25)*100)/100;save();render()}
function storeSelectedDecor(){const o=decorInventory(profile(who)).find(x=>x.uid===selectedDecor);if(!o)return;o.stored=true;selectedDecor=null;save();render()}
document.addEventListener('pointermove',decorPointerMove);document.addEventListener('pointerup',decorPointerUp);document.addEventListener('pointercancel',decorPointerUp);

function oldShopUnused(){let p=profile(who);view='shop';let items=who==='girl'?[['🌷','Flower Garden'],['🌈','Rainbow Arch'],['🦋','Butterfly Friends'],['🎀','Pink Bows']]:[['🌋','Slime Volcano'],['👻','Ghost Friends'],['🦇','Bat Cave'],['⚡','Lightning Tower']];app.innerHTML=renderHeader()+`<main class="wrap"><div class="panel center"><h1>🛍️ Decoration Shop</h1><p>🎟️ You have ${p.tickets} tickets. Each decoration costs 15.</p><div class="choices">${items.map(([e,n])=>`<button class="wordbtn" onclick="buy('${e}')">${e}<br>${n}<br>${p.decor.includes(e)?'✓ Owned':'15 tickets'}</button>`).join('')}</div><p>Your decorations appear in your world when you return to the map!</p><p>Collection: ${p.decor.join(' ')||'Nothing yet'}</p><button class="btn primary" onclick="home()">Back to world</button></div></main>`}
function oldBuyUnused(e){let p=profile(who);if(p.decor.includes(e))return;if(p.tickets<15){alert('Keep practicing to earn more tickets!');return}p.tickets-=15;p.decor.push(e);save();shop()}
try { render(); } catch(e) { document.getElementById('app').innerHTML='<main class="wrap"><div class="panel"><h1>⚠️ Startup error</h1><p>'+String(e.message).replace(/[<>&]/g,'')+'</p></div></main>'; }
</script></body></html>
